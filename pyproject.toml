[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanism"
version = "0.6.0+m6"
description = "Replicate-aware descriptive stability summaries for scalar effect fields"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "matplotlib>=3.6",
    "MDAnalysis>=2.4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev  = ["pytest>=7", "pillow>=9", "ruff>=0.5"]
msa  = ["biopython>=1.80"]

[project.urls]
Homepage = "https://github.com/daughterofstark/STRIDE"
Repository = "https://github.com/daughterofstark/STRIDE"
Issues = "https://github.com/daughterofstark/STRIDE/issues"

[project.scripts]
mechanism = "mechanism.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mechanism = ["configs/*.yaml", "configs/*.json"]


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
exclude = ["reference", "src/mechanism/_legacy.py"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"src/mechanism/cli.py" = ["E401"]
"src/mechanism/hierarchy/hierarchy.py" = ["E741"]
"src/mechanism/hierarchy/mapping.py" = ["F401"]
"src/mechanism/replicate/aggregator.py" = ["F401"]
