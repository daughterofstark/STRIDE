name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install pyarrow
      - name: Check manuscript-supported code for fatal Python errors
        run: >-
          ruff check
          --select E9,F63,F7,F82
          src/mechanism/statistics/reproducibility.py
          src/mechanism/statistics/varcomp.py
          validation/v9a_frozen_design.py
          validation/tests/test_v9a_frozen_design.py
          tests/test_readme_links.py
      - name: Run core tests (golden skips reported explicitly)
        run: pytest tests -q -rs
      - name: Run complete validation suite
        run: pytest validation/tests -q
      - name: Exercise V9A execute provenance path
        run: >-
          pytest validation/tests/test_v9a_frozen_design.py::test_execute_end_to_end_on_committed_snapshot
          -q
