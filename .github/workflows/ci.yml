name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install pyarrow
      - name: Check manuscript-supported code for fatal Python errors
        run: >-
          ruff check
          --select E9,F63,F7,F82
          src/mechanism/statistics/reproducibility.py
          src/mechanism/statistics/varcomp.py
          validation/v9a_frozen_design.py
          validation/tests/test_v9a_frozen_design.py
          tests/test_readme_links.py
      - name: Run core tests (golden skips reported explicitly)
        run: pytest tests -q -rs
      - name: Run complete validation suite
        run: pytest validation/tests -q
      - name: Exercise V9A execute provenance path
        run: >-
          pytest validation/tests/test_v9a_frozen_design.py::test_execute_end_to_end_on_committed_snapshot
          -q

  workflow-contract:
    name: Workflow contract (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: daughterofstark/STRIDE_downstream
          ref: 2b3eae3391716bed5d2e1e77792cd152074029b8
          path: STRIDE_downstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" pyarrow
      - run: python -m pip install -e ./STRIDE_downstream
      - name: Lint public workflow modules
        run: >-
          ruff check
          --config pyproject.toml
          --select E4,E7,E9,F,I,RUF022,BLE001
          src/mechanism/workflow
          tests/test_workflow.py
          tests/test_real_povme_integration.py
          examples/dengue_pocket/prepare_legacy_denv1_pilot.py
          examples/synthetic_pocket_fixture/povme_stub.py
      - name: Test public workflow failure paths
        run: pytest tests/test_workflow.py -q
      - name: Run the committed trajectory-to-summary fixture
        run: |
          fixture=examples/synthetic_pocket_fixture
          out="$RUNNER_TEMP/stride-workflow"
          stride validate --config "$fixture/stride.yaml"
          stride run --config "$fixture/stride.yaml" --output "$out/effects"
          stride summarize --config "$fixture/stride.yaml" \
            --run-effects "$out/effects" --output "$out/dataset"
          python -m stride_analysis --data-root "$out/dataset" \
            --output-dir "$out/canonical"
          test -f "$out/canonical/replicate_table.parquet"
          test -f "$out/canonical/stride_table.parquet"
